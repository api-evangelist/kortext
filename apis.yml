aid: kortext
name: Kortext
description: Kortext is a UK-headquartered digital learning and student engagement company, founded in
  2013 and led by CEO James Gray, that supplies etextbooks, course content, AI study tools and learning
  analytics to higher education institutions in the UK, US, Ireland, Australia and the Middle East. Its
  platform family covers content delivery and reading (Kortext study, read.kortext.com), the AI-assisted
  study layer (Kortext study+, Kortext IQ), teaching and reading-list tools (Kortext teach, KeyLinks),
  library acquisition workflows (Kortext acquire), engagement analytics (Kortext insights) and the unified
  Kortext fusion content and data layer. Publisher partners include Pearson, Wiley, McGraw Hill, Taylor
  & Francis, Oxford University Press and Palgrave, and in 2025 Follett Higher Education moved its North
  American ebook delivery onto Kortext. Institutional integration runs over 1EdTech LTI 1.1 and LTI 1.3
  (including Deep Linking) into Blackboard, Moodle, Canvas and other VLEs, plus EDI and API integration
  with library management systems such as Ex Libris Alma. Kortext does not operate a public developer
  portal; its production APIs are authenticated and undocumented publicly, and the only openly published
  machine-readable contract is the OpenAPI 3.1 description of its AI "labs" study-tools API.
