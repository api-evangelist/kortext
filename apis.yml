- name: Kortext Platform API
  description: The authenticated application API behind app.kortext.com serving the Kortext study reader
    and companion apps — identity, content, upload, cover, features, assessments, events and the genai
    and study-tools paths. Base paths are published in Kortext's own front-end runtime configuration;
    every resource requires a token issued by app.kortext.com/account/token and no public specification
    or developer documentation is offered.
  humanURL: https://app.kortext.com/identity/signin
  baseURL: https://app.kortext.com
