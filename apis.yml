apis:
- name: Kortext Labs AI Study Tools API
  description: FastAPI-generated service ("labsapi") behind Kortext's AI study features — quiz sessions
    generated from a book, a URL or pasted text; content indexing and retrieval-augmented chat over a
    student's Kortext bookshelf and uploaded files; flashcards, mnemonics, idea compass, reading plans,
    Mermaid visualisations and "extract wisdom" summarisation; podcast generation from content; and per-content
    study analytics (total time, confidence score, knowledge items, quiz session stats). 67 operations
    across Quiz, Content, Chat, Reading List, Podcast, Labs and Health Checks tags, secured with HTTP
    bearer tokens. The OpenAPI 3.1.0 description is served unauthenticated from Kortext's own labs demo
    and QA hosts; the operations themselves are bearer-gated.
  humanURL: https://api-demo.labs.kortext.com/docs
  baseURL: https://api-demo.labs.kortext.com
