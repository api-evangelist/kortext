apis:
- name: Kortext VLE / LTI Integration API
  description: >-
    The institution-facing integration surface behind vle.kortext.com — 1EdTech LTI 1.1 launch and LTI
    1.3 Deep Linking endpoints that place Kortext content and KeyLinks reading lists inside Blackboard,
    Moodle, Canvas and other VLEs, plus authenticated REST resources for books, consumers (institutions),
    journeys and KeyLinks lists. Endpoint paths are published in the application's own runtime configuration
    at /assets/config.json; the resources themselves return 401 without an institutional token and Kortext
    publishes no OpenAPI for them.
  humanURL: https://kortext.com/blog/platform-updates/how-we-integrate-with-your-workflow/
  baseURL: https://vle.kortext.com
