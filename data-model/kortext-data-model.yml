observations:
- >-
  contentId is the universal join key. Every study artifact (quiz, wisdom, podcast, index, score)
  is addressed through it, and the contract exposes no operation to list a user's content — the
  caller is expected to already hold contentIds from the Kortext reader.
- >-
  The Chat and Tutor tag groups are the SAME 17 content operations mounted twice under
  /chat/v1/content/* and /tutor/v1/content/*, with duplicated operationIds distinguished only by
  the framework-generated path suffix. That is 34 of the 67 operations describing 17 behaviours.
- >-
  Naming is inconsistent across the model: camelCase (contentId, quizSessionId) dominates but the
  task and visualisation schemas use snake_case (task_id, content_id).
- >-
  No identifier format is declared anywhere — no pattern, no example, no id prefix scheme.
