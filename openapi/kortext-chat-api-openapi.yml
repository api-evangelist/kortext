  /chat/v1/content/visualise:
    post:
      tags:
      - Chat
      summary: Generate a Mermaid diagram visualization
      description: 'Generate a Mermaid diagram visualization based on content and diagram type.


        This endpoint analyzes the content and creates a visual representation using Mermaid markdown syntax.

        The visualization can be of different types:

        - document-structure: Shows the hierarchical structure of the document

        - concept-map: Shows relationships between main concepts and supporting ideas

        - learning-plan: Shows the learning journey with prerequisites and next steps

        - notes-organisation: Organizes lecture notes into structured categories


        Parameters:

        - **contentId**: UUID of the content to visualize (if found in database)

        - **type**: Type of diagram to generate

        - **prompt**: Additional context or instructions (will be used if contentId is not found)


        Returns:

        - A Mermaid markdown diagram that can be rendered by the client'
      operationId: visualise_content_chat_v1_content_visualise_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisualisationRequest'
        required: true
      responses:
        '200':
          description: Successfully generated visualization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisualisationResponse'
        '404':
          description: Content not found and no prompt provided
        '400':
          description: Invalid diagram type
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
