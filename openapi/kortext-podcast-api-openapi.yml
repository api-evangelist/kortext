openapi: 3.2.0
info:
  title: labsapi Podcast API
  version: 1.13.0.223565
tags:
- name: Podcast
paths:
  /podcast/v1/content/{content_id}/podcast:
    post:
      tags:
      - Podcast
      summary: Create Podcast
      description: 'Create a new podcast from content.


        Args:

        content_id: ID of content to create podcast from

        title: Title for the podcast

        voice1: Voice to use for first speaker (default: Jenny)

        voice2: Voice to use for second speaker (default: Guy)

        current_user: Current authenticated user

        db: Database session


        Returns:

        Created podcast document'
      operationId: create_podcast_podcast_v1_content__content_id__podcast_post
      security:
      - HTTPBearer: []
      parameters:
      - name: content_id
        in: path
        required: true
        schema:
          type: string
          title: Content Id
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_create_podcast_podcast_v1_content__content_id__podcast_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /podcast/v1/podcasts:
    get:
      tags:
      - Podcast
      summary: List Podcasts
      description: 'List all podcasts accessible by current user with pagination.


        Args:

        page: Page number

        page_size: Items per page

        current_user: Current authenticated user


        Returns:

        Paginated list of podcasts'
      operationId: list_podcasts_podcast_v1_podcasts_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number
          default: 1
          title: Page
        description: Page number
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page
          default: 10
          title: Pagesize
        description: Items per page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPodcastResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /podcast/v1/podcasts/{podcast_id}:
    get:
      tags:
      - Podcast
      summary: Get Podcast
      description: 'Get podcast details by ID if user has access.


        Args:

        podcast_id: ID of the podcast to retrieve

        current_user: Current authenticated user


        Returns:

        Podcast details including audio URL and script


        Raises:

        HTTPException: If podcast not found or user lacks access'
      operationId: get_podcast_podcast_v1_podcasts__podcast_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: podcast_id
        in: path
        required: true
        schema:
          type: string
          title: Podcast Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PodcastResponseDto'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Podcast
      summary: Delete Podcast
      description: 'Delete a podcast.


        Args:

        podcast_id: ID of the podcast to delete

        current_user: Current authenticated user


        Raises:

        HTTPException:

        - 404: If podcast not found

        - 500: If there''s an error deleting the podcast or its audio file'
      operationId: delete_podcast_podcast_v1_podcasts__podcast_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: podcast_id
        in: path
        required: true
        schema:
          type: string
          title: Podcast Id
      responses:
        '204':
          description: Podcast successfully deleted
        '404':
          description: Podcast not found
        '500':
          description: Internal server error during deletion
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    PodcastResponseDto:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Unique identifier for the document
        podcastMetadata:
          type: object
          title: Podcastmetadata
          description: Podcast metadata
        createdAt:
          type: string
          format: date-time
          title: Createdat
          description: Creation timestamp
        script:
          anyOf:
          - type: object
          - type: 'null'
          title: Script
          description: Generated podcast script
        audioBlobUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Audiobloburl
          description: URL to audio blob
        status:
          type: string
          title: Status
          description: Document status
        title:
          type: string
          title: Title
          description: Get title from podcast_metadata.
          readOnly: true
      type: object
      required:
      - id
      - createdAt
      - status
      - title
      title: PodcastResponseDto
      description: Schema for document response.
    Body_create_podcast_podcast_v1_content__content_id__podcast_post:
      properties:
        title:
          type: string
          title: Title
        voice1:
          type: string
          title: Voice1
          default: Jenny
        voice2:
          type: string
          title: Voice2
          default: Guy
      type: object
      required:
      - title
      title: Body_create_podcast_podcast_v1_content__content_id__podcast_post
    PaginatedPodcastResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PodcastResponseDto'
          type: array
          title: Items
          description: List of podcast documents
        total:
          type: integer
          title: Total
          description: Total number of documents
        page:
          type: integer
          title: Page
          description: Current page number
        pageSize:
          type: integer
          title: Pagesize
          description: Number of items per page
        totalPages:
          type: integer
          title: Totalpages
          description: Total number of pages
      type: object
      required:
      - items
      - total
      - page
      - pageSize
      - totalPages
      title: PaginatedPodcastResponse
      description: Paginated response for podcasts.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
